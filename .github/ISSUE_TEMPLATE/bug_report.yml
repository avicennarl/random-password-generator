name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do not use this form for security issues —
        see [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the exact command or steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pwdgen version
      description: Output of `pwdgen --version` (or the commit hash).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, and Python version (`python --version`).
    validations:
      required: true
