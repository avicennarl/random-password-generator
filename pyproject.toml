[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pwdgen"
version = "0.1.0"
description = "Offline, cryptographically secure password and passphrase generator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MPL-2.0" }
authors = [{ name = "Avicenna Ari Sumirat" }]
keywords = ["password", "passphrase", "generator", "security", "privacy", "offline", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
pwdgen = "pwdgen.cli:main"

[project.urls]
Homepage = "https://github.com/avicennarl/random-password-generator"
Source = "https://github.com/avicennarl/random-password-generator"
Issues = "https://github.com/avicennarl/random-password-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pwdgen"]

[tool.hatch.build.targets.sdist]
include = ["src/pwdgen", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
